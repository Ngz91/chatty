syntax = "proto3";
package chatty;
option go_package = "chatty/proto/v1/chat";

message User {
  string id = 1;
  string username = 2;
}

message ClientMessage {
  User user = 1;
  string content = 2;
}

message ServerMessage {
  string ip = 1;
  string port = 2;
  User user = 3;
  string content = 4;
}

